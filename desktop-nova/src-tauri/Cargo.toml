[package]
name = "desktop-nova"
default-run = "desktop-nova"
version = "0.2.4"
description = "Litematica-Nova desktop viewer for Minecraft .litematic projections"
authors = ["Litematica-Nova"]
edition = "2021"

[features]
popup-smoke = []
development-runtime = ["nova-protected-loader/development-runtime", "nova-protection/development-runtime"]

[[bin]]
name = "popup_smoke"
path = "src/bin/popup_smoke.rs"
required-features = ["popup-smoke"]

[build-dependencies]
sha2 = "0.10"
serde_json = "1"
tauri-build = { version = "2", features = [] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dependencies]
anyhow = "1"
flate2 = "1.1"
sha1 = "0.10"
raw-window-handle = "=0.6.2"
tauri = { version = "=2.11.1", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
base64 = "0.22"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "cookies"] }
httpdate = "=1.0.3"
scraper = { version = "=0.24.0", default-features = false }
image = "0.25"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
viewer-launch-contract = { path = "../../tools/viewer-core/crates/viewer-launch-contract" }
nova-render-protocol = { path = "../../tools/viewer-core/crates/nova-render-protocol" }
nova-protection = { path = "../../tools/nova-protection", default-features = false, features = ["client"] }
nova-protected-loader = { path = "../../tools/nova-protected-loader" }
# Locked official implementation; local Windows installer-launch error fix.
tauri-plugin-updater = { version = "=2.10.0", path = "../../third_party/tauri-plugin-updater" }
# The locked updater uses reqwest 0.13 without default features. Explicitly
# enable its OS proxy discovery (not the unrelated application's 0.12 client).
updater-http = { package = "reqwest", version = "=0.13.2", default-features = false, features = ["json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
minisign-verify = "=0.2.5"
tauri-runtime = "=2.11.1"

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "=2.4.0"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
fs2 = "=0.4.3"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "=0.27.0"
objc = "=0.2.7"
core-graphics-types = "=0.1.3"
foreign-types = "=0.5.0"
block = "=0.1.6"
