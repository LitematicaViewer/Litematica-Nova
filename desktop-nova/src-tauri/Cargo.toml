[package]
name = "desktop-nova"
default-run = "desktop-nova"
version = "0.2.0"
description = "Litematica-Nova desktop viewer for Minecraft .litematic projections"
authors = ["Litematica-Nova"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
serde_json = "1"

[dependencies]
tauri = { version = "=2.11.1", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
base64 = "0.22"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
httpdate = "=1.0.3"
scraper = { version = "=0.24.0", default-features = false }
image = "0.25"
viewer-launch-contract = { path = "../../tools/viewer-core/crates/viewer-launch-contract" }
tauri-plugin-updater = "=2.10.0"

[dev-dependencies]
minisign-verify = "=0.2.5"

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "=2.4.0"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading"] }
