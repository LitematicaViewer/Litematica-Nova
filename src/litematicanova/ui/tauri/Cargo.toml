[package]
name = "litematica-nova-desktop"
version = "0.1.0"
description = "Tauri shell for the Litematica Nova React UI"
authors = ["Litematica Nova"]
edition = "2021"

[lib]
name = "litematica_nova_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
