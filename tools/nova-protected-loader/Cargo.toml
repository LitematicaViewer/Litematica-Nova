[package]
name = "nova-protected-loader"
version = "0.2.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[workspace]

[dependencies]
anyhow = "1"
nova-protection = { path = "../nova-protection", default-features = false, features = ["client"] }
ring = "=0.17.14"
serde_json = "1"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "nova-render-service"
path = "src/bin/nova-render-service.rs"

[[bin]]
name = "nova-build-worker"
path = "src/bin/nova-build-worker.rs"

[profile.release]
lto = "thin"
strip = "symbols"
debug = 0
