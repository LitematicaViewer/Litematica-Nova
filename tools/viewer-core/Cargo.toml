[package]
name = "litematica_core"
version = "0.1.0"
edition = "2024"
autobins = false

[[bin]]
name = "litematica_core"
path = "src/main.rs"

[[bin]]
name = "litematica_native_viewer"
path = "src/bin/litematica_native_viewer.rs"

[[bin]]
name = "stockpile_server"
path = "src/bin/stockpile_server.rs"

[features]
default = ["public-beta"]
public-beta = []
# Development/test oracle only. Production runtime normalization is native
# Rust and must not compile or invoke the Mojang Java DataFix bridge.
datafix-oracle = []

[workspace]
resolver = "3"
members = [
    "crates/viewer-launch-contract",
    "crates/nova-render-protocol",
]
default-members = [
    ".",
    "crates/viewer-launch-contract",
]

[dependencies]
ab_glyph = "=0.2.32"
anyhow = "1.0"
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.22"
bytemuck = { version = "1.16", features = ["derive"] }
fastnbt = "2.6"
flate2 = "1.1"
crc32fast = "1"
glam = "0.27"
image = "0.25"
pollster = "0.3"
rand = "0.8"
rayon = "=1.12.0"
viewer-launch-contract = { path = "crates/viewer-launch-contract" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
toml = "1.1.2"
wgpu = "0.19"
winit = "0.29"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
arrayvec = "=0.7.6"
memmap2 = "0.9"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "=3.0.11"
