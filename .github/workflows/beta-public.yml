name: Beta Windows protected candidate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-public-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\desktop-nova\src-tauri\target\public-beta
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare official Windows toolchains
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix desktop-nova
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify signed protected payload and build public helpers
        shell: pwsh
        run: |
          ./desktop-nova/scripts/prepare-protected-backend.ps1 -RepoRoot $env:GITHUB_WORKSPACE
      - name: Configure unsigned updater candidate only
        shell: pwsh
        run: |
          # Module signature checks remain mandatory. CI has no installer updater
          # signing key and does not publish any release, tag or update metadata.
          '{"bundle":{"targets":["nsis"],"createUpdaterArtifacts":false}}' | Set-Content -LiteralPath desktop-nova/src-tauri/tauri.ci.json -Encoding utf8
      - name: Build single-file NSIS candidate with official Tauri action
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        with:
          projectPath: desktop-nova
          args: --bundles nsis --config src-tauri/tauri.ci.json
          includeDebug: false
          includeRelease: true
          includeUpdaterJson: false
          uploadPlainBinary: false
          retryAttempts: 0
          # No tagName, releaseId, releaseName or write token: build only.
      - name: Stage only the Windows Setup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -LiteralPath (Join-Path $env:CARGO_TARGET_DIR 'release/bundle/nsis') -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one real Windows x64 NSIS installer.' }
          $destination = Join-Path $env:GITHUB_WORKSPACE 'dist/public-beta-candidate'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName -Destination (Join-Path $destination 'Setup.exe')
          'Windows x64: single NSIS candidate; no automatic GitHub Release or tag.' >> $env:GITHUB_STEP_SUMMARY
          'macOS 和 Linux 将在下个版本支持。' >> $env:GITHUB_STEP_SUMMARY
      - name: Upload Setup.exe only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Litematica-Nova-Beta-Windows-x64-${{ github.sha }}
          path: dist/public-beta-candidate/Setup.exe
          if-no-files-found: error
          retention-days: 14
