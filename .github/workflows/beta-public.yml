name: Public application checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-public-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-nova/package-lock.json
      - name: Install public frontend dependencies
        run: npm ci --prefix desktop-nova
      - name: Check the public source boundary
        run: node desktop-nova/scripts/check-public-build.mjs --source
      - name: Build the ordinary application frontend
        run: npm run build --prefix desktop-nova

# Desktop/runtime compilation and signing have one authority: the Organization
# private repository. Public pull requests never run on a sensitive local runner
# and cannot directly invoke a private reusable workflow.
