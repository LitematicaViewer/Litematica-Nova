name: Beta desktop candidates

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Candidate build platforms
        required: true
        default: all
        type: choice
        options: [all, local, linux, macos]

permissions:
  contents: read

concurrency:
  group: nova-public-candidates
  cancel-in-progress: false

jobs:
  windows-linux:
    if: >-
      github.repository == 'LitematicaViewer/Litematica-Nova' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.platforms != 'macos'
    runs-on: [self-hosted, Windows, X64, nova-local]
    timeout-minutes: 180
    env:
      NOVA_LOCAL_REPOSITORY: ${{ vars.NOVA_LOCAL_REPOSITORY }}
      NOVA_WINDOWS_RUNTIME_PACKAGE_DIR: D:\NovaCI\runtime\x86_64-pc-windows-msvc
    steps:
      # Reuse the existing workspace. Never checkout, clean or switch it.
      - name: Build Windows x64 locally
        if: inputs.platforms != 'linux'
        shell: pwsh
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          & (Join-Path $env:NOVA_LOCAL_REPOSITORY 'desktop-nova/scripts/run-local-ci.ps1') -ExpectedSha $env:BUILD_SHA -Platform Windows
      - name: Select Windows distributables
        if: inputs.platforms != 'linux'
        id: windows
        shell: pwsh
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          . 'D:\NovaCI\toolchains\windows\Activate.ps1'
          node (Join-Path $env:NOVA_LOCAL_REPOSITORY 'desktop-nova/scripts/stage-ci-artifacts.mjs') --target x86_64-pc-windows-msvc --sha $env:BUILD_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows Setup only
        if: inputs.platforms != 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Nova-Windows-x64-${{ github.sha }}
          path: ${{ steps.windows.outputs.paths }}
          if-no-files-found: error
          retention-days: 14
      - name: Build Linux x64 through local WSL
        shell: pwsh
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          & (Join-Path $env:NOVA_LOCAL_REPOSITORY 'desktop-nova/scripts/run-local-ci.ps1') -ExpectedSha $env:BUILD_SHA -Platform Linux
      - name: Select Linux distributables
        id: linux
        shell: pwsh
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          . 'D:\NovaCI\toolchains\windows\Activate.ps1'
          node (Join-Path $env:NOVA_LOCAL_REPOSITORY 'desktop-nova/scripts/stage-ci-artifacts.mjs') --target x86_64-unknown-linux-gnu --sha $env:BUILD_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Linux distributables only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Nova-Linux-x64-${{ github.sha }}
          path: ${{ steps.linux.outputs.paths }}
          if-no-files-found: error
          retention-days: 14

  macos-runtime:
    if: >-
      github.repository == 'LitematicaViewer/Litematica-Nova' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.platforms != 'local' && inputs.platforms != 'linux'
    runs-on: [self-hosted, Windows, X64, nova-local]
    timeout-minutes: 15
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    env:
      NOVA_LOCAL_REPOSITORY: ${{ vars.NOVA_LOCAL_REPOSITORY }}
      NOVA_RUNTIME_TARGET: ${{ matrix.target }}
      BUILD_SHA: ${{ github.sha }}
    steps:
      # This local job sends the three approved runtime files only, never a checkout.
      - name: Verify the approved target runtime
        id: runtime
        shell: pwsh
        run: |
          . 'D:\NovaCI\toolchains\windows\Activate.ps1'
          $verify = @'
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          import { execFileSync } from 'node:child_process';
          const repo = process.env.NOVA_LOCAL_REPOSITORY;
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], { cwd: repo, encoding: 'utf8' }).trim();
          if (sha !== process.env.BUILD_SHA) throw new Error('The local public source differs from the requested candidate.');
          const { validatePackage } = await import(pathToFileURL(path.join(repo, 'desktop-nova/scripts/check-public-checkout.mjs')));
          const target = process.env.NOVA_RUNTIME_TARGET, directory = path.join('D:/NovaCI/runtime', target);
          const identity = await validatePackage(directory, 'libnova_protected_module.dylib');
          const version = JSON.parse(fs.readFileSync(path.join(repo, 'desktop-nova/src-tauri/tauri.conf.json'), 'utf8')).version;
          if (identity.version !== version || !identity.buildId.endsWith('-' + target)) throw new Error('The runtime version/target differs from the candidate.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'directory=' + directory + '\n');
          console.log('Approved runtime ready: ' + target);
          '@
          node --input-type=module -e $verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Transfer approved runtime files only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Nova-runtime-${{ matrix.target }}-${{ github.sha }}
          path: ${{ steps.runtime.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 1

  macos:
    needs: macos-runtime
    if: >-
      github.repository == 'LitematicaViewer/Litematica-Nova' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.platforms != 'local' && inputs.platforms != 'linux'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            architecture: x64
          - runner: macos-15
            target: aarch64-apple-darwin
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Receive approved target runtime files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Nova-runtime-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/nova-runtime/${{ matrix.target }}
      - name: Select the approved target runtime
        run: printf 'NOVA_RUNTIME_PACKAGE_DIR=%s\n' "$RUNNER_TEMP/nova-runtime/${{ matrix.target }}" >> "$GITHUB_ENV"
      - name: Prepare target-native Vulkan implementation
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.architecture == 'x64' && 'x86_64' || 'arm64' }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install molten-vk
          library="$(brew --prefix molten-vk)/lib/libMoltenVK.dylib"
          test -f "$library"
          xcrun lipo "$library" -verify_arch "$TARGET_ARCH"
          printf 'NOVA_MOLTENVK_LIBRARY=%s\n' "$library" >> "$GITHUB_ENV"
      - name: Build macOS candidate
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/desktop-nova/src-tauri/target/ci-${{ matrix.target }}
        run: node desktop-nova/scripts/build-public-platform.mjs --target '${{ matrix.target }}' --candidate
      - name: Select macOS distributables
        id: macos
        env:
          BUILD_SHA: ${{ github.sha }}
        run: node desktop-nova/scripts/stage-ci-artifacts.mjs --target '${{ matrix.target }}' --sha "$BUILD_SHA"
      - name: Upload macOS distributables only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Nova-macOS-${{ matrix.architecture }}-${{ github.sha }}
          path: ${{ steps.macos.outputs.paths }}
          if-no-files-found: error
          retention-days: 14
