name: macOS build preparation

on:
  workflow_dispatch:
    inputs:
      private_sha:
        description: Fixed local source commit
        required: true
        type: string
      seed:
        description: Release build seed
        required: true
        default: nova-beta02-cross-r1
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: nova-local-build
  cancel-in-progress: false

jobs:
  inputs:
    if: >-
      github.repository == 'LitematicaViewer/Litematica-Nova' &&
      github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, X64, nova-local]
    timeout-minutes: 20
    env:
      NOVA_LOCAL_REPOSITORY: ${{ vars.NOVA_LOCAL_REPOSITORY }}
      NOVA_CI_TASK_KEY: ${{ secrets.NOVA_CI_TASK_KEY }}
      SOURCE_SHA: ${{ inputs.private_sha }}
      BUILD_SEED: ${{ inputs.seed }}
    steps:
      # No checkout, branch switch, reset or clean in the sole local workspace.
      - name: Prepare fixed local build inputs
        id: input
        shell: pwsh
        run: |
          . 'D:\NovaCI\toolchains\windows\Activate.ps1'
          $driver = Join-Path $env:NOVA_LOCAL_REPOSITORY 'desktop-nova/scripts/private-macos-task.mjs'
          $destination = Join-Path $env:RUNNER_TEMP ('nova-inputs-' + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          foreach ($target in @('x86_64-apple-darwin','aarch64-apple-darwin')) {
            node $driver prepare --source-sha $env:SOURCE_SHA --seed $env:BUILD_SEED --target $target --task $env:GITHUB_RUN_ID --output (Join-Path $destination ($target + '.nci'))
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          'directory=' + $destination >> $env:GITHUB_OUTPUT
      - name: Upload task inputs only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Nova-build-inputs-${{ github.run_id }}
          path: ${{ steps.input.outputs.directory }}/*.nci
          if-no-files-found: error
          retention-days: 1

  backend:
    needs: inputs
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    # Both private targets use the verified ARM host toolchain. Public x64
    # app packaging and CLI execution happen separately on macos-15-intel.
    runs-on: macos-15
    timeout-minutes: 150
    env:
      NOVA_CI_TASK_KEY: ${{ secrets.NOVA_CI_TASK_KEY }}
      SOURCE_SHA: ${{ inputs.private_sha }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Nova-build-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/nova-inputs
      - name: Open the bound build input
        run: |
          node desktop-nova/scripts/private-macos-task.mjs open-source --source-sha "$SOURCE_SHA" --target "$TARGET" --task "$GITHUB_RUN_ID" --input "$RUNNER_TEMP/nova-inputs/$TARGET.nci" --directory "$RUNNER_TEMP/nova-task-$TARGET"
      - name: Build the actual target module
        id: build
        continue-on-error: true
        run: |
          node desktop-nova/scripts/private-macos-task.mjs execute --source-sha "$SOURCE_SHA" --target "$TARGET" --task "$GITHUB_RUN_ID" --directory "$RUNNER_TEMP/nova-task-$TARGET" --output "$RUNNER_TEMP/nova-result-$TARGET.nci"
      - name: Upload task result only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Nova-build-result-${{ matrix.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/nova-result-${{ matrix.target }}.nci
          if-no-files-found: error
          retention-days: 1
      - name: Remove temporary task material
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os,pathlib,shutil
          base=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          target=os.environ['TARGET']
          item=(base/('nova-task-'+target)).resolve()
          if item.parent != base or not item.name.startswith('nova-task-'): raise SystemExit(1)
          if item.exists(): shutil.rmtree(item)
          PY
      - name: Preserve the actual build outcome
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: test "$BUILD_OUTCOME" = success

  collect:
    if: always() && needs.inputs.result == 'success'
    needs: [inputs, backend]
    runs-on: [self-hosted, Windows, X64, nova-local]
    timeout-minutes: 20
    env:
      NOVA_LOCAL_REPOSITORY: ${{ vars.NOVA_LOCAL_REPOSITORY }}
      NOVA_CI_TASK_KEY: ${{ secrets.NOVA_CI_TASK_KEY }}
      SOURCE_SHA: ${{ inputs.private_sha }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: Nova-build-result-*-${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/nova-results-${{ github.run_id }}
      - name: Validate and stage returned modules locally
        shell: pwsh
        run: |
          . 'D:\NovaCI\toolchains\windows\Activate.ps1'
          $driver = Join-Path $env:NOVA_LOCAL_REPOSITORY 'desktop-nova/scripts/private-macos-task.mjs'
          $failed = $false
          foreach ($target in @('x86_64-apple-darwin','aarch64-apple-darwin')) {
            $destination = Join-Path $env:NOVA_LOCAL_REPOSITORY ('.tmp/mac-cloud-results/' + $env:GITHUB_RUN_ID + '/' + $target)
            $input = Join-Path $env:RUNNER_TEMP ('nova-results-' + $env:GITHUB_RUN_ID + '/nova-result-' + $target + '.nci')
            node $driver open-result --source-sha $env:SOURCE_SHA --target $target --task $env:GITHUB_RUN_ID --input $input --directory $destination
            if ($LASTEXITCODE -ne 0) { $failed = $true; continue }
            node $driver stage-result --source-sha $env:SOURCE_SHA --target $target --task $env:GITHUB_RUN_ID --directory $destination
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { throw 'One or more target builds failed; diagnostics remain private on the local runner.' }
          'Both target modules are staged locally for signing, service registration and public app packaging.' >> $env:GITHUB_STEP_SUMMARY
