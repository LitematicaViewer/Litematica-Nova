name: stockpile-server

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/viewer-core/**"
      - ".github/workflows/stockpile-server.yml"

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            binary: stockpile_server.exe
            out: bin/stockpile-server/windows-x64/stockpile_server.exe
          - platform: linux-x64
            os: ubuntu-latest
            binary: stockpile_server
            out: bin/stockpile-server/linux-x64/stockpile_server
          - platform: macos-x64
            os: macos-13
            binary: stockpile_server
            out: bin/stockpile-server/macos-x64/stockpile_server
          - platform: macos-arm64
            os: macos-14
            binary: stockpile_server
            out: bin/stockpile-server/macos-arm64/stockpile_server

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev
      - name: Build stockpile_server
        working-directory: tools/viewer-core
        run: cargo build --release --bin stockpile_server
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p "$(dirname "${{ matrix.out }}")"
          cp "tools/viewer-core/target/release/${{ matrix.binary }}" "${{ matrix.out }}"
      - uses: actions/upload-artifact@v4
        with:
          name: stockpile-server-${{ matrix.platform }}
          path: ${{ matrix.out }}
